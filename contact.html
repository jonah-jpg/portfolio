    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
        // Apply dark mode class early to avoid white flash
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script src="https://kit.fontawesome.com/bce1cff179.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="wrapper">
        <a href="index.html" id="logo">JMTM</a>
        <div class="topnav">
            <a href="index.html">Home</a>

            <a href="aboutme.html">About Me</a>
            <a class="active" href="contact.html">Contact</a>
            <a href="resume.html">Resume</a>
        </div>
        <main class="page-content" id="contact-page">
            <div class="container">
                <label class="toggle1">
                    <input type="checkbox" id="dark-mode-toggle" />
                    <span class="toggle1-slider"></span>
                    <span class="on text">dark</span>
                    <span class="off text">light</span>
                </label>
            </div>
            <h3 class="contact-title">Reach me</h3>
            <h5><a class="contact-text" id="email" href="mailto:jonahmanthey@protonmail.com">jonahmanthey@protonmail.com</a></h5>

            </div>
        </footer>
    </div>

        <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleCheckbox = document.getElementById('dark-mode-toggle');
            if (!toggleCheckbox) return;

            // Load saved preference
            const darkModeEnabled = localStorage.getItem('darkMode') === 'true';

            // Apply dark mode and update toggle state
            document.documentElement.classList.toggle('dark-mode', darkModeEnabled);
            toggleCheckbox.checked = darkModeEnabled;

            // On toggle, update class and save preference
            toggleCheckbox.addEventListener('change', () => {
                const isDark = toggleCheckbox.checked;
                document.documentElement.classList.toggle('dark-mode', isDark);
                localStorage.setItem('darkMode', isDark);
            });
        });
    </script>
</body>
